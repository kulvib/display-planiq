name: Display single-node PostgreSQL smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/single-node-smoke.yml"
      - "backend/**"
      - "client/**"
      - "scripts/**"
      - ".dockerignore"
      - "render-single-node.yaml"

jobs:
  single-node-database-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build PostgreSQL plus Display backend image
        run: docker build --file backend/Dockerfile.single-node --tag display-single-node:ci .
      - name: Bootstrap database and API on a disposable persistent mount
        shell: bash
        run: |
          set -euo pipefail
          volume="$RUNNER_TEMP/display-single-node-volume"
          mkdir -p "$volume"
          echo "volume=$volume" >> "$GITHUB_ENV"
          docker run -d --name display-single-node-ci \
            -p 127.0.0.1:18000:10000 \
            -v "$volume:/var/data/clientflow-release-artifacts" \
            -e PORT=10000 -e ENVIRONMENT=production \
            -e SECRET_KEY=ci-only-secret-key-with-at-least-32-characters \
            -e JWT_ISSUER=planiq-display-api -e JWT_AUDIENCE=planiq-display \
            display-single-node:ci
          for attempt in $(seq 1 180); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18000/health/db > /tmp/db-health.json; then
              grep -q '"status"' /tmp/db-health.json
              break
            fi
            if [[ "$attempt" -eq 180 ]]; then
              docker logs display-single-node-ci
              exit 1
            fi
            sleep 2
          done
          # Runtime regression: PostgreSQL must be permitted to own the socket's
          # restricted group. The app role must be able to connect via peer auth.
          docker exec display-single-node-ci sh -ceu '
            id -nG postgres | tr " " "\n" | grep -qx display_app
            socket=/run/display-postgres/.s.PGSQL.5432
            test -S "$socket"
            test "$(stat -c "%a:%G" "$socket")" = 770:display_app
          '
          docker exec -u display_app display-single-node-ci \
            psql -X -v ON_ERROR_STOP=1 -h /run/display-postgres -d display \
            -c 'CREATE SCHEMA ci_persistence_marker'
          docker exec -u display_app display-single-node-ci \
            psql -X -v ON_ERROR_STOP=1 -h /run/display-postgres -d display \
            -c 'CREATE TABLE ci_persistence_marker.proof(id INTEGER PRIMARY KEY)'
          docker exec -u display_app display-single-node-ci \
            psql -X -v ON_ERROR_STOP=1 -h /run/display-postgres -d display \
            -c 'INSERT INTO ci_persistence_marker.proof VALUES (42)'
          # Database intentionally binds only to the Unix socket; no TCP listener.
          if docker exec -u display_app display-single-node-ci \
            psql -X -h 127.0.0.1 -p 5432 -d display -tAc 'SELECT 1'; then
            echo 'Local PostgreSQL TCP port unexpectedly reachable' >&2
            exit 1
          fi
      - name: Restart and prove durable schema plus data
        shell: bash
        run: |
          set -euo pipefail
          docker stop --time 90 display-single-node-ci
          docker rm display-single-node-ci
          docker run -d --name display-single-node-ci \
            -p 127.0.0.1:18000:10000 \
            -v "$volume:/var/data/clientflow-release-artifacts" \
            -e PORT=10000 -e ENVIRONMENT=production \
            -e SECRET_KEY=ci-only-secret-key-with-at-least-32-characters \
            -e JWT_ISSUER=planiq-display-api -e JWT_AUDIENCE=planiq-display \
            display-single-node:ci
          for attempt in $(seq 1 180); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18000/health/db >/tmp/db-health.json; then
              break
            fi
            if [[ "$attempt" -eq 180 ]]; then
              docker logs display-single-node-ci
              exit 1
            fi
            sleep 2
          done
          marker="$(docker exec -u display_app display-single-node-ci \
            psql -X -A -t -v ON_ERROR_STOP=1 -h /run/display-postgres -d display \
            -c 'SELECT id FROM ci_persistence_marker.proof')"
          test "$marker" = '42'
          echo 'SINGLE_NODE_SMOKE_OK: schema preserved, no external PostgreSQL, persisted data survived restart'
      - name: 62B logical backup and isolated PostgreSQL 18 restore proof
        shell: bash
        run: |
          set -euo pipefail
          # CI fixture only. No production connection, live backup upload,
          # migration, service change or release approval in this step.
          dump="$RUNNER_TEMP/display-62b-disposable.pgdump"
          docker exec -u display_app display-single-node-ci \
            pg_dump --no-password --format=custom --no-owner --no-acl \
              -h /run/display-postgres -U display_app -d display > "$dump"
          test -s "$dump"
          test "$(head -c 5 "$dump")" = PGDMP
          docker exec -i -u display_app display-single-node-ci \
            pg_restore --list < "$dump" >/dev/null

          # Throwaway isolated PostgreSQL, no host port or network access.
          docker run -d --name display-62b-isolated-restore \
            --network none -e POSTGRES_PASSWORD=disposable-ci-only-password \
            postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
          for attempt in $(seq 1 60); do
            if docker exec -u postgres display-62b-isolated-restore \
              pg_isready -q -U postgres -d postgres; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              docker logs display-62b-isolated-restore
              exit 1
            fi
            sleep 1
          done
          docker exec -u postgres display-62b-isolated-restore \
            createdb -U postgres display_restore_62b
          docker exec -i -u postgres display-62b-isolated-restore \
            pg_restore --exit-on-error --single-transaction --no-owner --no-acl \
              -U postgres -d display_restore_62b < "$dump"
          # Prove durable application data and migrated metadata, not just
          # pg_restore's zero exit code.
          marker="$(docker exec -u postgres display-62b-isolated-restore \
            psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d display_restore_62b \
            -c 'SELECT id FROM ci_persistence_marker.proof')"
          test "$marker" = 42
          migrations="$(docker exec -u postgres display-62b-isolated-restore \
            psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d display_restore_62b \
            -c 'SELECT count(*) FROM alembic_version')"
          test "$migrations" = 1
          echo 'DISPLAY_62B_CI_FIXTURE_RESTORE_PASS: isolated Postgres 18, schema, data, migrations'
      - name: Delete 62B throwaway restore data (always)
        if: always()
        run: |
          docker rm -f -v display-62b-isolated-restore || true
          rm -f "$RUNNER_TEMP/display-62b-disposable.pgdump"
      - name: Print diagnostics on failure
        if: failure()
        run: docker logs display-single-node-ci || true
      - name: Stop disposable service
        if: always()
        run: docker rm -f display-single-node-ci || true
