name: Archive exact approved ClientFlow bundle to GitHub Release

"on":
  workflow_dispatch:
    inputs:
      approval_run_id:
        description: Successful canonical release-approve.yml GitHub Actions run ID
        required: true
        type: string
      expected_source_sha:
        description: Exact source commit approved by that run (40 lowercase hex)
        required: true
        type: string
      expected_approved_sha256:
        description: SHA-256 of the approved bundle TAR, not the Actions artifact ZIP
        required: true
        type: string
      expected_approval_reference:
        description: Exact immutable approval reference from APPROVAL.json
        required: true
        type: string
      confirm_archive:
        description: I approve archiving these exact approved bytes as a new no-replace GitHub prerelease
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: clientflow-approved-github-archive-${{ inputs.expected_source_sha }}
  cancel-in-progress: false

jobs:
  archive:
    name: Verify approval provenance and publish no-replace GitHub release asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact publishing workflow main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Require explicit archive consent and green current main CI
        shell: bash
        env:
          CONFIRM_ARCHIVE: ${{ inputs.confirm_archive }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_APPROVED_SHA256: ${{ inputs.expected_approved_sha256 }}
          APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRM_ARCHIVE" = true
          test "$GITHUB_REF_NAME" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_APPROVED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$APPROVAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          python3 scripts/verify_github_ci_run.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --workflow ci.yml \
            --head-branch main

      - name: Require the exact successful canonical approval run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVAL_RUN_ID" > "$RUNNER_TEMP/approval-run.json"
          python3 - "$RUNNER_TEMP/approval-run.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "id": int(os.environ["APPROVAL_RUN_ID"]),
              "head_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "path": ".github/workflows/release-approve.yml",
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "head_repository": {"full_name": os.environ["GITHUB_REPOSITORY"]},
          }
          for key in ("id", "head_sha", "path", "event", "status", "conclusion"):
              if run.get(key) != expected[key]:
                  raise SystemExit(f"Approved run provenance mismatch: {key}")
          if (run.get("head_repository") or {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("Approval is not from this repository")
          print(f"EXACT_SUCCESSFUL_APPROVAL_RUN={run['id']}")
          PY

      - name: Download original canonical approved artifact (no rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clientflow-approved-${{ inputs.expected_source_sha }}
          path: ${{ runner.temp }}/approved-handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.approval_run_id }}

      - name: Verify exact approval metadata, full TAR and embedded bytes
        id: handoff
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_APPROVED_SHA256: ${{ inputs.expected_approved_sha256 }}
          EXPECTED_APPROVAL_REFERENCE: ${{ inputs.expected_approval_reference }}
        run: |
          set -euo pipefail
          python3 scripts/verify_clientflow_approved_release_asset.py \
            --handoff "$RUNNER_TEMP/approved-handoff" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-approved-sha256 "$EXPECTED_APPROVED_SHA256" \
            --expected-approval-reference "$EXPECTED_APPROVAL_REFERENCE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Refuse existing tag or release (no replacement)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.handoff.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Approved release archive already exists: $TAG" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>"$RUNNER_TEMP/tag-check.err"; then
            echo "Release tag already exists: $TAG" >&2
            exit 1
          fi
          if ! grep -q 'HTTP 404' "$RUNNER_TEMP/tag-check.err"; then
            cat "$RUNNER_TEMP/tag-check.err" >&2
            echo 'Cannot prove tag is absent; refusing archive publication' >&2
            exit 1
          fi

      - name: Create transport-only GitHub prerelease from exact approved bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.handoff.outputs.tag }}
          ASSET_NAME: ${{ steps.handoff.outputs.asset_name }}
          ASSET_PATH: ${{ steps.handoff.outputs.bundle_path }}
          BUNDLE_SIZE: ${{ steps.handoff.outputs.approved_bundle_size }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          BUNDLE_SHA: ${{ inputs.expected_approved_sha256 }}
          APPROVAL_REFERENCE: ${{ inputs.expected_approval_reference }}
          APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.txt" <<EOF
          Approved ClientFlow release artifact archive. Not a Render release-store publication,
          runtime-catalog promotion, client deployment or rollback authorization.

          Source commit: $SOURCE_SHA
          Approval run: $APPROVAL_RUN_ID
          Approval reference: $APPROVAL_REFERENCE
          Approved bundle SHA-256: $BUNDLE_SHA
          Approved bundle size: $BUNDLE_SIZE bytes

          Verify the downloaded TAR by SHA-256 before any use.
          EOF
          gh release create "$TAG" \
            "$ASSET_PATH#$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --latest=false \
            --title "ClientFlow approved $TAG - archive transport only" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"

      - name: Independently verify GitHub asset metadata after publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.handoff.outputs.tag }}
          ASSET_NAME: ${{ steps.handoff.outputs.asset_name }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_APPROVED_SHA256: ${{ inputs.expected_approved_sha256 }}
          EXPECTED_SIZE: ${{ steps.handoff.outputs.approved_bundle_size }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/archived-release.json"
          python3 - "$RUNNER_TEMP/archived-release.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if release.get("tag_name") != os.environ["TAG"] or release.get("prerelease") is not True:
              raise SystemExit("Wrong release tag or release is not transport-only prerelease")
          if release.get("target_commitish") != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("Archived release target commit differs")
          assets = release.get("assets") or []
          if len(assets) != 1 or assets[0].get("name") != os.environ["ASSET_NAME"]:
              raise SystemExit("Archived release must have exactly the approved TAR asset")
          asset = assets[0]
          if asset.get("size") != int(os.environ["EXPECTED_SIZE"]):
              raise SystemExit("Archived asset size differs")
          if asset.get("digest") != "sha256:" + os.environ["EXPECTED_APPROVED_SHA256"]:
              raise SystemExit("Archived asset digest differs")
          print("APPROVED_GITHUB_RELEASE_ARCHIVE=PASS")
          print("approved_release_url=" + release["html_url"])
          print("approved_bundle_sha256=" + os.environ["EXPECTED_APPROVED_SHA256"])
          PY
