name: Integrate verified FreeRDP 3.33.1 browser artifact into Viborg1 PR

on:
  pull_request:
    paths:
      - ".github/workflows/native-rdp-wasm-integrate.yml"

permissions: {}

jobs:
  integrate-pinned-artifact:
    # Only the PlanIQ-owned, nonproduction Viborg1 pilot PR; never forks.
    if: >-
      github.event.pull_request.number == 408 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/native-rdp-browser-viborg1-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact pilot branch (never main)
        uses: actions/checkout@v4
        with:
          ref: feature/native-rdp-browser-viborg1-pilot
          fetch-depth: 1

      - name: Refuse concurrent branch revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download completed successful pinned FreeRDP 3.33.1 build
        uses: actions/download-artifact@v4
        with:
          name: planiq-freerdp-3.33.1-wasm
          run-id: 45066909031
          repository: kulvib/display-planiq
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-freerdp

      - name: Verify artifact SHA-256 and install static assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil

          root = Path("verified-freerdp")
          target = Path("frontend/public/native-rdp")
          expected = {
              "sdl-freerdp.js": ("609715445d2dc9f637f386572566b10fa8b3b9f0736f483a1d6a5ed423ee8cb5",269234),
              "sdl-freerdp.wasm": ("808752fe85bb1d65964d19f4b5d40cf990d1708c437ff0e40ec92f5994d7cf90",11089855),
          }
          expected_names = set(expected) | {"provenance.json"}
          if {p.name for p in root.iterdir()} != expected_names:
              raise SystemExit("STOP: unexpected FreeRDP artifact entries")
          manifest = json.loads((root / "provenance.json").read_text())
          if (manifest.get("freerdp_source_commit") != "65bcca1913a28cbdd7eb913599f692bd2b707991" or
              manifest.get("freerdp_version") != "3.33.1" or manifest.get("emsdk") != "6.0.12" or
              set(manifest.get("files",{})) != set(expected)):
              raise SystemExit("STOP: FreeRDP provenance mismatch")
          for name, (sha, size) in expected.items():
              f = root / name
              if (f.is_symlink() or not f.is_file() or f.stat().st_size != size or
                  hashlib.sha256(f.read_bytes()).hexdigest() != sha or
                  manifest["files"][name] != {"bytes":size, "sha256":sha}):
                  raise SystemExit("STOP: pinned FreeRDP bytes are invalid")
          if (root / "sdl-freerdp.wasm").read_bytes()[:4] != b"\0asm":
              raise SystemExit("STOP: invalid WASM magic")
          for name in sorted(expected_names):
              shutil.copyfile(root / name, target / name)

          manifest_path = Path("SHA256SUMS.txt")
          records = {}
          for line in manifest_path.read_text().splitlines():
              if not line.strip():
                  continue
              digest, name = line.split("  ", 1)
              if name in records:
                  raise SystemExit("STOP: duplicate locked source")
              records[name] = digest
          for name in expected_names:
              filename = target / name
              records[filename.as_posix()] = hashlib.sha256(filename.read_bytes()).hexdigest()
          manifest_path.write_text(
              "".join(f"{digest}  {name}\n" for name,digest in sorted(records.items()))
          )
          print("Verified native RDP artifact copied, SHA256SUMS updated.")
          PY
          node frontend/scripts/checkNativeRdpWasm.mjs

      - name: Commit verified binaries to feature branch, never main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/public/native-rdp/sdl-freerdp.js frontend/public/native-rdp/sdl-freerdp.wasm \
            frontend/public/native-rdp/provenance.json SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Identical artifact already committed"
            exit 0
          fi
          git commit -m "build(native-rdp): pin reviewed FreeRDP 3.33.1 SDL3 WASM assets"
          git push origin HEAD:refs/heads/feature/native-rdp-browser-viborg1-pilot
